<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Company OS org chart</title>
  <desc id="desc">User and founder report to Project Manager orchestrator, who leads Market Research, Product Manager, People Ops, and Performance Marketer, all linked by the Active Bots channel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="orch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="userGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect width="920" height="560" rx="20" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- header strip -->
  <text x="460" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" letter-spacing="0.04em">COMPANY OS</text>
  <text x="460" y="54" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">orchestrator + specialists · Active Bots</text>

  <!-- User / founder -->
  <g filter="url(#shadow)">
    <rect x="355" y="72" width="210" height="56" rx="14" fill="url(#userGrad)"/>
  </g>
  <text x="460" y="96" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">User / founder</text>
  <text x="460" y="114" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#cbd5e1">sets company goals</text>

  <!-- connector user → PM -->
  <line x1="460" y1="128" x2="460" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Project Manager (orchestrator) -->
  <g filter="url(#shadow)">
    <rect x="320" y="160" width="280" height="72" rx="16" fill="url(#orch)"/>
  </g>
  <text x="460" y="188" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Project Manager</text>
  <rect x="400" y="198" width="120" height="20" rx="10" fill="#ffffff" fill-opacity="0.22"/>
  <text x="460" y="212" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e0e7ff">orchestrator</text>

  <!-- trunk under PM -->
  <line x1="460" y1="232" x2="460" y2="268" stroke="#64748b" stroke-width="2"/>
  <!-- horizontal bar to specialists -->
  <line x1="110" y1="268" x2="810" y2="268" stroke="#64748b" stroke-width="2"/>
  <!-- drops to each specialist -->
  <line x1="110" y1="268" x2="110" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="343" y1="268" x2="343" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="577" y1="268" x2="577" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="268" x2="810" y2="290" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Specialist cards: width 200, gap ~33, centers at 110, 343, 577, 810 -->
  <!-- Market Research -->
  <g filter="url(#shadow)">
    <rect x="10" y="292" width="200" height="88" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <rect x="10" y="292" width="6" height="88" rx="3" fill="#6366f1"/>
  <text x="110" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Market Research</text>
  <text x="110" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6366f1" font-weight="600">specialist</text>
  <text x="110" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">intel · audience · trends</text>

  <!-- Product Manager -->
  <g filter="url(#shadow)">
    <rect x="243" y="292" width="200" height="88" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <rect x="243" y="292" width="6" height="88" rx="3" fill="#6366f1"/>
  <text x="343" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Product Manager</text>
  <text x="343" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6366f1" font-weight="600">specialist</text>
  <text x="343" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">problems · specs · ship</text>

  <!-- People Ops -->
  <g filter="url(#shadow)">
    <rect x="477" y="292" width="200" height="88" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <rect x="477" y="292" width="6" height="88" rx="3" fill="#6366f1"/>
  <text x="577" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">People Ops</text>
  <text x="577" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6366f1" font-weight="600">specialist</text>
  <text x="577" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">hiring · onboarding</text>

  <!-- Performance Marketer -->
  <g filter="url(#shadow)">
    <rect x="710" y="292" width="200" height="88" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  </g>
  <rect x="710" y="292" width="6" height="88" rx="3" fill="#6366f1"/>
  <text x="810" y="322" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Performance Marketer</text>
  <text x="810" y="342" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6366f1" font-weight="600">specialist</text>
  <text x="810" y="362" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#64748b">growth · experiments</text>

  <!-- Active Bots channel band -->
  <rect x="40" y="420" width="840" height="100" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="460" y="450" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#065f46">Active Bots</text>
  <text x="460" y="470" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#047857">team channel · multi-bot coordination</text>

  <!-- five small seat chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#064e3b">
    <rect x="70" y="486" width="130" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="135" y="501" text-anchor="middle">Project Manager</text>
    <rect x="215" y="486" width="120" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="275" y="501" text-anchor="middle">Market Research</text>
    <rect x="350" y="486" width="120" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="410" y="501" text-anchor="middle">Product Manager</text>
    <rect x="485" y="486" width="100" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="535" y="501" text-anchor="middle">People Ops</text>
    <rect x="600" y="486" width="150" height="22" rx="11" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="675" y="501" text-anchor="middle">Performance Marketer</text>
  </g>

  <!-- soft links from specialists down into channel -->
  <line x1="110" y1="380" x2="110" y2="420" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="343" y1="380" x2="343" y2="420" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="577" y1="380" x2="577" y2="420" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="810" y1="380" x2="810" y2="420" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3"/>
  <!-- PM also seats in channel — soft connector from PM card center-ish via left side isn't needed; the channel lists PM -->
</svg>
